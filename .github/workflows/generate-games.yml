```yaml
name: Generate Games Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate games.json
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.html"],
              text=True
          ).splitlines()

          games = []

          for filename in tracked:
              path = Path(filename)

              # Only HTML files in the root directory.
              if path.parent != Path("."):
                  continue

              lower = filename.lower()

              # Exclude the homepage and template.
              if lower in {"index.html", "g@metemplate.html"}:
                  continue

              # A game filename must end with "game.html".
              # Examples: fnafgame.html, minecraftgame.html
              if not re.search(r"game\.html$", filename, re.IGNORECASE):
                  continue

              # Make the display title.
              name = re.sub(
                  r"game\.html$",
                  "",
                  filename,
                  flags=re.IGNORECASE
              )

              name = re.sub(r"[-_]+", " ", name).strip()

              title = " ".join(
                  word.capitalize()
                  for word in name.split()
              ) or "Game"

              # Look for matching icon:
              # fnafgame.html -> fnafgame.png
              icon = re.sub(
                  r"game\.html$",
                  "game.png",
                  filename,
                  flags=re.IGNORECASE
              )

              games.append({
                  "filename": filename,
                  "title": title,
                  "url": filename,
                  "icon": icon if Path(icon).is_file() else ""
              })

          games.sort(
              key=lambda game: game["title"].lower()
          )

          Path("games.json").write_text(
              json.dumps(
                  {
                      "generated": True,
                      "games": games
                  },
                  indent=2
              ),
              encoding="utf-8"
          )

          print(f"Found {len(games)} games.")

          for game in games:
              print(f" - {game['filename']}")

      - name: Commit updated games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "No changes to games.json."
          else
            git commit -m "Update games index"
            git push
          fi
```
