<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Unblocked XY</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #0b0b0f;
    --surface: #15161c;
    --surface-hover: #1a1b22;
    --border: #252630;
    --border-strong: #30313a;
    --text: #fff;
    --muted: #a9aab4;
    --muted-2: #8e909c;
}

html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-strong);
    backdrop-filter: blur(12px);
}

.header-content {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    white-space: nowrap;
}

.search-wrapper {
    flex: 1;
    min-width: 220px;
}

#search {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    outline: none;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
}

.header-button,
.back-button {
    padding: 13px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
}

.header-button:hover,
.back-button:hover,
.theme-button:hover {
    background: var(--surface-hover);
    border-color: #666875;
}

.disguise-wrapper {
    position: relative;
}

.disguise-menu {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    min-width: 220px;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,.35);
}

.disguise-menu.visible {
    display: grid;
    gap: 5px;
}

.disguise-option {
    padding: 10px 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
}

.disguise-option:hover {
    background: var(--surface-hover);
}

main,
#settingsPage {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px 60px;
}

.hero {
    margin-bottom: 30px;
}

.hero h1,
.settings-top h1 {
    margin: 0 0 8px;
    font-size: clamp(30px, 5vw, 48px);
}

.hero p,
.settings-card p {
    color: var(--muted);
}

#status {
    margin: 25px 0;
    color: var(--muted-2);
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.game-card {
    display: block;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    transition: transform .18s ease, border-color .18s ease;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: #454752;
}

.game-icon {
    width: 100%;
    aspect-ratio: 1;
    display: block;
    object-fit: cover;
    background: var(--surface-hover);
}

.game-info {
    padding: 13px 14px 15px;
}

.game-title {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.no-games {
    padding: 35px;
    text-align: center;
    border: 1px dashed var(--border-strong);
    border-radius: 16px;
    color: var(--muted-2);
}

footer {
    padding: 25px;
    text-align: center;
    color: var(--muted-2);
    font-size: 13px;
}

/* Settings */
#settingsPage {
    display: none;
    max-width: 900px;
}

#settingsPage.visible {
    display: block;
}

.settings-top {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.settings-top h1 {
    margin: 0;
}

.settings-card {
    padding: 22px;
    margin-bottom: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
}

.settings-card h2 {
    margin: 0 0 8px;
}

.theme-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.theme-button {
    padding: 18px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    text-align: left;
}

.theme-button strong,
.theme-button span {
    display: block;
}

.theme-button span {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
}

.theme-button.active {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--text);
}

/* Embedded side panel */
.embed-toggle {
    position: fixed;
    right: 0;
    top: 50%;
    z-index: 300;
    padding: 14px 10px;
    border: 0;
    border-radius: 12px 0 0 12px;
    background: #4f46e5;
    color: #fff;
    cursor: pointer;
    font-weight: 700;
    writing-mode: vertical-rl;
    transform: translateY(-50%);
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
}

.embed-toggle:hover {
    background: #6366f1;
}

.embed-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 250;
    width: min(420px, 90vw);
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border-strong);
    box-shadow: -8px 0 25px rgba(0,0,0,.4);
    transform: translateX(100%);
    transition: transform .25s ease;
}

.embed-panel.visible {
    transform: translateX(0);
}

.embed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border-strong);
}

.embed-header strong {
    font-size: 16px;
}

.embed-close {
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
}

.embed-frame {
    width: 100%;
    flex: 1;
    border: 0;
    background: #fff;
}

@media (max-width: 600px) {
    header {
        padding: 15px;
    }

    main,
    #settingsPage {
        padding: 25px 15px 50px;
    }

    .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
    }

    .disguise-wrapper,
    .header-button {
        width: 100%;
    }

    .disguise-menu {
        left: 0;
        right: 0;
    }

    .theme-buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">Secret Unblocked XY</div>

        <div class="search-wrapper">
            <input id="search" type="search" placeholder="Search games..." autocomplete="off">
        </div>

        <div class="disguise-wrapper">
            <button id="disguiseButton" class="header-button" type="button">
                Disguise Tab
            </button>

            <div id="disguiseMenu" class="disguise-menu">
                <button class="disguise-option" data-disguise="word">Microsoft Word</button>
                <button class="disguise-option" data-disguise="classroom">Google Classroom</button>
                <button class="disguise-option" data-disguise="powerpoint">Microsoft PowerPoint</button>
                <button class="disguise-option" data-disguise="google">Google</button>
            </div>
        </div>

        <button id="settingsButton" class="header-button" type="button">⚙ Settings</button>
    </div>
</header>

<button id="embedToggle" class="embed-toggle" type="button">
    Open Listen
</button>

<aside id="embedPanel" class="embed-panel" aria-label="Embedded Listen site">
    <div class="embed-header">
        <strong>Secret Unblocked Listen</strong>
        <button id="embedClose" class="embed-close" type="button" aria-label="Close embed">×</button>
    </div>

    <iframe
        class="embed-frame"
        src="https://zacharyceiley-jpg.github.io/secret-Unblocked-Listen/"
        title="Secret Unblocked Listen"
        loading="lazy"
        allow="autoplay; fullscreen"
    ></iframe>
</aside>

<main id="homePage">
    <section class="hero">
        <h1>Games</h1>
        <p>Choose a game to play.</p>
    </section>

    <div id="status">Searching repository for games...</div>
    <div id="games" class="games-grid"></div>
</main>

<section id="settingsPage">
    <div class="settings-top">
        <button id="backButton" class="back-button" type="button">← Back</button>
        <h1>Settings</h1>
    </div>

    <div class="settings-card">
        <h2>Site Appearance</h2>
        <p>Choose whether the entire site uses Light Mode or Dark Mode.</p>

        <div class="theme-buttons">
            <button class="theme-button" data-theme="dark">
                <strong>Dark Mode</strong>
                <span>Dark background and interface.</span>
            </button>

            <button class="theme-button" data-theme="light">
                <strong>Light Mode</strong>
                <span>Light background and interface.</span>
            </button>
        </div>
    </div>
</section>

<footer id="footer">Secret Unblocked</footer>

<script>
const disguises = {
    word: {
        title: "Microsoft Word",
        favicon: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Microsoft_Office_Word_%282025%E2%80%93present%29.svg/960px-Microsoft_Office_Word_%282025%E2%80%93present%29.svg.png"
    },
    classroom: {
        title: "Google Classroom",
        favicon: "https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/google-classroom-icon.png"
    },
    powerpoint: {
        title: "Microsoft PowerPoint",
        favicon: "https://static.vecteezy.com/system/resources/thumbnails/027/179/348/small_2x/microsoft-power-point-icon-logo-symbol-free-png.png"
    },
    google: {
        title: "Google",
        favicon: "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Google_Favicon_2025.svg/3840px-Google_Favicon_2025.svg.png"
    }
};

const owner = "zacharyceiley-jpg";
const repo = "Secret-Unblocked-XY";
const branch = "main";
const apiURL = `https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`;

const gamesContainer = document.getElementById("games");
const statusElement = document.getElementById("status");
const searchInput = document.getElementById("search");
const disguiseButton = document.getElementById("disguiseButton");
const disguiseMenu = document.getElementById("disguiseMenu");
const settingsPage = document.getElementById("settingsPage");
const homePage = document.getElementById("homePage");
const footer = document.getElementById("footer");

let games = [];

function setFavicon(url) {
    let icon = document.querySelector("link[rel='icon']");

    if (!icon) {
        icon = document.createElement("link");
        icon.rel = "icon";
        document.head.appendChild(icon);
    }

    icon.href = url || "";
}

function applyDisguise(type) {
    const disguise = disguises[type];
    if (!disguise) return;

    document.title = disguise.title;
    setFavicon(disguise.favicon);
    disguiseButton.textContent = `Tab: ${disguise.title}`;
    disguiseMenu.classList.remove("visible");
}

function applyTheme(theme) {
    const light = theme === "light";
    const values = light
        ? ["#f5f5f7", "#fff", "#eeeef2", "#dedee5", "#c9c9d2", "#111116", "#5f606b", "#70717c"]
        : ["#0b0b0f", "#15161c", "#1a1b22", "#252630", "#30313a", "#fff", "#a9aab4", "#8e909c"];

    ["--bg", "--surface", "--surface-hover", "--border", "--border-strong", "--text", "--muted", "--muted-2"]
        .forEach((name, index) => {
            document.documentElement.style.setProperty(name, values[index]);
        });

    localStorage.setItem("siteTheme", theme);

    document.querySelectorAll(".theme-button").forEach(button => {
        button.classList.toggle("active", button.dataset.theme === theme);
    });
}

function getGameTitle(filename) {
    return filename
        .replace(/\.html$/i, "")
        .replace(/game$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function renderGames(list) {
    gamesContainer.innerHTML = "";

    if (!list.length) {
        gamesContainer.innerHTML = '<div class="no-games">No games found.</div>';
        return;
    }

    list.forEach(game => {
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = game.url;
        card.title = game.title;

        card.innerHTML = `
            <img class="game-icon" src="${game.icon}" alt="${escapeHTML(game.title)}" loading="lazy"
                onerror="this.style.display='none'">
            <div class="game-info">
                <div class="game-title">${escapeHTML(game.title)}</div>
            </div>
        `;

        gamesContainer.appendChild(card);
    });
}

async function loadGames() {
    try {
        const response = await fetch(apiURL, {
            headers: { Accept: "application/vnd.github+json" }
        });

        if (!response.ok) throw new Error(`GitHub API returned ${response.status}`);

        const files = await response.json();

        games = files
            .filter(file =>
                file.type === "file" &&
                /\.html$/i.test(file.name) &&
                /game/i.test(file.name) &&
                file.name.toLowerCase() !== "index.html"
            )
            .map(file => {
                const iconName = file.name.replace(/\.html$/i, ".png");

                return {
                    filename: file.name,
                    title: getGameTitle(file.name),
                    url: `https://${owner}.github.io/${repo}/${encodeURIComponent(file.name)}`,
                    icon: `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodeURIComponent(iconName)}`
                };
            })
            .sort((a, b) => a.title.localeCompare(b.title));

        statusElement.textContent = `${games.length} game${games.length === 1 ? "" : "s"} found`;
        renderGames(games);
    } catch (error) {
        console.error(error);
        statusElement.textContent = "Unable to load games from the repository.";
        gamesContainer.innerHTML = `
            <div class="no-games">
                <strong>Could not load the games.</strong><br><br>
                Please check that the repository is public and try again.
            </div>
        `;
    }
}

disguiseButton.addEventListener("click", () => {
    disguiseMenu.classList.toggle("visible");
});

document.addEventListener("click", event => {
    if (!event.target.closest(".disguise-wrapper")) {
        disguiseMenu.classList.remove("visible");
    }
});

document.querySelectorAll(".disguise-option").forEach(option => {
    option.addEventListener("click", () => applyDisguise(option.dataset.disguise));
});

document.getElementById("settingsButton").addEventListener("click", () => {
    settingsPage.classList.add("visible");
    homePage.style.display = "none";
    footer.style.display = "none";
    window.scrollTo(0, 0);
});

document.getElementById("backButton").addEventListener("click", () => {
    settingsPage.classList.remove("visible");
    homePage.style.display = "";
    footer.style.display = "";
    window.scrollTo(0, 0);
});

document.querySelectorAll(".theme-button").forEach(button => {
    button.addEventListener("click", () => applyTheme(button.dataset.theme));
});

searchInput.addEventListener("input", () => {
    const query = searchInput.value.trim().toLowerCase();

    renderGames(games.filter(game =>
        game.title.toLowerCase().includes(query) ||
        game.filename.toLowerCase().includes(query)
    ));
});

const embedPanel = document.getElementById("embedPanel");

document.getElementById("embedToggle").addEventListener("click", () => {
    embedPanel.classList.add("visible");
});

document.getElementById("embedClose").addEventListener("click", () => {
    embedPanel.classList.remove("visible");
});

applyTheme(localStorage.getItem("siteTheme") || "dark");
loadGames();
</script>

</body>
</html>
