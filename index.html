<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Unblocked XY</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b0f;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 20px;
        background: rgba(11, 11, 15, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid #22232b;
    }

    .header-content {
        max-width: 1200px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 26px;
        font-weight: 800;
        white-space: nowrap;
    }

    .search-wrapper {
        flex: 1;
        min-width: 220px;
    }

    #search {
        width: 100%;
        padding: 13px 16px;
        border: 1px solid #30313a;
        border-radius: 12px;
        outline: none;
        background: #15161c;
        color: white;
        font-size: 15px;
    }

    #search:focus {
        border-color: #666875;
    }

    .disguise-wrapper {
        position: relative;
    }

    #disguiseButton {
        padding: 13px 16px;
        border: 1px solid #30313a;
        border-radius: 12px;
        background: #15161c;
        color: white;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
    }

    #disguiseButton:hover {
        background: #202128;
        border-color: #666875;
    }

    .disguise-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 190px;
        padding: 8px;
        background: #15161c;
        border: 1px solid #30313a;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .disguise-menu.visible {
        display: grid;
        gap: 5px;
    }

    .disguise-option {
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: white;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
    }

    .disguise-option:hover {
        background: #292a33;
    }

    main {
        max-width: 1200px;
        margin: auto;
        padding: 35px 20px 60px;
    }

    .hero {
        margin-bottom: 30px;
    }

    .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(30px, 5vw, 48px);
    }

    .hero p {
        margin: 0;
        color: #a9aab4;
    }

    #status {
        margin: 25px 0;
        color: #8e909c;
    }

    .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
    }

    .game-card {
        display: block;
        overflow: hidden;
        text-decoration: none;
        color: white;
        background: #15161c;
        border: 1px solid #252630;
        border-radius: 16px;
        transition:
            transform 0.18s ease,
            border-color 0.18s ease,
            background 0.18s ease;
    }

    .game-card:hover {
        transform: translateY(-4px);
        border-color: #454752;
        background: #1a1b22;
    }

    .game-card:active {
        transform: translateY(-1px);
    }

    .game-icon {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: block;
        object-fit: cover;
        background: #202128;
    }

    .game-info {
        padding: 13px 14px 15px;
    }

    .game-title {
        font-size: 16px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .no-games {
        padding: 35px;
        text-align: center;
        border: 1px dashed #343640;
        border-radius: 16px;
        color: #90929d;
    }

    footer {
        padding: 25px;
        text-align: center;
        color: #666873;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        header {
            padding: 15px;
        }

        main {
            padding: 25px 15px 50px;
        }

        .games-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 13px;
        }

        .disguise-wrapper {
            width: 100%;
        }

        #disguiseButton {
            width: 100%;
        }

        .disguise-menu {
            left: 0;
            right: 0;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div class="logo">Secret Unblocked Team</div>

        <div class="search-wrapper">
            <input
                id="search"
                type="search"
                placeholder="Search games..."
                autocomplete="off"
                spellcheck="false"
            >
        </div>

        <div class="disguise-wrapper">
            <button id="disguiseButton" type="button">
                Disguise Tab
            </button>

            <div id="disguiseMenu" class="disguise-menu">
                <button class="disguise-option" data-disguise="word">
                    Microsoft Word
                </button>
                <button class="disguise-option" data-disguise="classroom">
                    Google Classroom
                </button>
                <button class="disguise-option" data-disguise="powerpoint">
                    Microsoft PowerPoint
                </button>
                <button class="disguise-option" data-disguise="google">
                    Google
                </button>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Games</h1>
        <p>Choose a game to play.</p>
    </section>

    <div id="status">Searching repository for games...</div>

    <div id="games" class="games-grid"></div>
</main>

<footer>
    Secret Unblocked
</footer>

<script>
    const GITHUB_OWNER = "zacharyceiley-jpg";
    const GITHUB_REPO = "Secret-Unblocked-XY";
    const GITHUB_BRANCH = "main";

    const API_URL =
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/?ref=${GITHUB_BRANCH}`;

    const gamesContainer = document.getElementById("games");
    const statusElement = document.getElementById("status");
    const searchInput = document.getElementById("search");
    const disguiseButton = document.getElementById("disguiseButton");
    const disguiseMenu = document.getElementById("disguiseMenu");

    let games = [];

    const disguises = {
        word: {
            title: "Microsoft Word",
            color: "#185abd",
            letter: "W"
        },
        classroom: {
            title: "Google Classroom",
            color: "#0f9d58",
            letter: "C"
        },
        powerpoint: {
            title: "Microsoft PowerPoint",
            color: "#d24726",
            letter: "P"
        },
        google: {
            title: "Google",
            color: "#4285f4",
            letter: "G"
        }
    };

    function setFavicon(color, letter) {
        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                <rect width="64" height="64" rx="12" fill="${color}"/>
                <text x="32" y="43"
                      text-anchor="middle"
                      fill="white"
                      font-family="Arial"
                      font-size="38"
                      font-weight="bold">${letter}</text>
            </svg>
        `;

        let favicon = document.querySelector("link[rel='icon']");

        if (!favicon) {
            favicon = document.createElement("link");
            favicon.rel = "icon";
            document.head.appendChild(favicon);
        }

        favicon.href = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function applyDisguise(type) {
        const disguise = disguises[type];

        if (!disguise) {
            return;
        }

        document.title = disguise.title;
        setFavicon(disguise.color, disguise.letter);
        disguiseButton.textContent = `Tab: ${disguise.title}`;
        disguiseMenu.classList.remove("visible");
    }

    disguiseButton.addEventListener("click", () => {
        disguiseMenu.classList.toggle("visible");
    });

    document.addEventListener("click", event => {
        if (!event.target.closest(".disguise-wrapper")) {
            disguiseMenu.classList.remove("visible");
        }
    });

    document.querySelectorAll(".disguise-option").forEach(option => {
        option.addEventListener("click", () => {
            applyDisguise(option.dataset.disguise);
        });
    });

    function getGameTitle(filename) {
        return filename
            .replace(/\.html$/i, "")
            .replace(/game$/i, "")
            .replace(/[-_]+/g, " ")
            .replace(/\s+/g, " ")
            .trim()
            .replace(/\b\w/g, letter => letter.toUpperCase());
    }

    function getIconName(htmlName) {
        return htmlName.replace(/\.html$/i, ".png");
    }

    function renderGames(list) {
        gamesContainer.innerHTML = "";

        if (list.length === 0) {
            gamesContainer.innerHTML = `
                <div class="no-games">
                    No games found.
                </div>
            `;
            return;
        }

        list.forEach(game => {
            const card = document.createElement("a");

            card.className = "game-card";
            card.href = game.url;
            card.title = game.title;

            card.innerHTML = `
                <img
                    class="game-icon"
                    src="${game.icon}"
                    alt="${escapeHTML(game.title)}"
                    loading="lazy"
                    onerror="this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
                            <rect width="400" height="400" fill="#202128"/>
                            <text x="200" y="205"
                                  text-anchor="middle"
                                  dominant-baseline="middle"
                                  fill="#777"
                                  font-family="Arial"
                                  font-size="28">
                                No Image
                            </text>
                        </svg>
                    `)}'"
                >

                <div class="game-info">
                    <div class="game-title">
                        ${escapeHTML(game.title)}
                    </div>
                </div>
            `;

            gamesContainer.appendChild(card);
        });
    }

    function escapeHTML(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    async function loadGames() {
        try {
            statusElement.textContent = "Searching repository for games...";

            const response = await fetch(API_URL, {
                headers: {
                    "Accept": "application/vnd.github+json"
                }
            });

            if (!response.ok) {
                throw new Error(`GitHub API returned ${response.status}`);
            }

            const files = await response.json();

            const gameFiles = files.filter(file =>
                file.type === "file" &&
                /\.html$/i.test(file.name) &&
                /game/i.test(file.name) &&
                file.name.toLowerCase() !== "index.html"
            );

            games = gameFiles.map(file => {
                const iconName = getIconName(file.name);

                return {
                    filename: file.name,
                    title: getGameTitle(file.name),
                    url:
                        `https://${GITHUB_OWNER}.github.io/` +
                        `${GITHUB_REPO}/${encodeURIComponent(file.name)}`,
                    icon:
                        `https://raw.githubusercontent.com/` +
                        `${GITHUB_OWNER}/${GITHUB_REPO}/` +
                        `${GITHUB_BRANCH}/${encodeURIComponent(iconName)}`
                };
            });

            games.sort((a, b) => a.title.localeCompare(b.title));

            statusElement.textContent =
                `${games.length} game${games.length === 1 ? "" : "s"} found`;

            renderGames(games);
        } catch (error) {
            console.error(error);

            statusElement.textContent =
                "Unable to load games from the repository.";

            gamesContainer.innerHTML = `
                <div class="no-games">
                    <strong>Could not load the games.</strong>
                    <br><br>
                    Please check that the repository is public and try again.
                </div>
            `;
        }
    }

    searchInput.addEventListener("input", () => {
        const query = searchInput.value.trim().toLowerCase();

        const filtered = games.filter(game =>
            game.title.toLowerCase().includes(query) ||
            game.filename.toLowerCase().includes(query)
        );

        renderGames(filtered);
    });

    loadGames();
</script>

</body>
</html>
