<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: white;
    }

    /* Header */
    header {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 24px;
        background: #181818;
        border-bottom: 1px solid #303030;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .logo {
        font-size: 25px;
        font-weight: 800;
        white-space: nowrap;
    }

    #search {
        flex: 1;
        max-width: 650px;
        padding: 12px 16px;
        border: 1px solid #444;
        border-radius: 12px;
        outline: none;
        background: #222;
        color: white;
        font-size: 16px;
    }

    #search:focus {
        border-color: #777;
    }

    .settings-button {
        margin-left: auto;
        border: 1px solid #444;
        background: #222;
        color: white;
        border-radius: 10px;
        padding: 11px 14px;
        cursor: pointer;
        font-size: 16px;
    }

    .settings-button:hover {
        background: #2b2b2b;
    }

    /* Main page */
    main {
        padding: 30px;
        max-width: 1500px;
        margin: auto;
    }

    .welcome {
        margin-bottom: 25px;
    }

    .welcome h1 {
        margin: 0 0 7px;
        font-size: 32px;
    }

    .welcome p {
        margin: 0;
        color: #aaa;
    }

    .section-title {
        font-size: 22px;
        margin: 25px 0 15px;
    }

    /* Game grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 18px;
    }

    .game {
        background: #1d1d1d;
        border: 1px solid #353535;
        border-radius: 14px;
        padding: 10px;
        cursor: pointer;
        transition: transform .15s, background .15s, border-color .15s;
    }

    .game:hover {
        transform: translateY(-3px);
        background: #252525;
        border-color: #555;
    }

    /* Images are ALWAYS square and automatically cropped */
    .game img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 10px;
        background: #292929;
    }

    .game-name {
        padding: 11px 3px 3px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .empty {
        grid-column: 1 / -1;
        padding: 50px 20px;
        text-align: center;
        color: #888;
        border: 1px dashed #444;
        border-radius: 14px;
    }

    /* Settings */
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.65);
        z-index: 20;
    }

    .settings-panel {
        width: min(440px, calc(100% - 30px));
        margin: 80px auto;
        background: #1b1b1b;
        border: 1px solid #444;
        border-radius: 16px;
        padding: 22px;
    }

    .settings-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .settings-top h2 {
        margin: 0;
    }

    .close {
        background: none;
        border: 0;
        color: #aaa;
        font-size: 25px;
        cursor: pointer;
    }

    .setting {
        margin-top: 22px;
        padding: 15px;
        background: #242424;
        border-radius: 12px;
    }

    .setting-title {
        font-weight: 700;
        margin-bottom: 6px;
    }

    .setting-description {
        color: #999;
        font-size: 14px;
        line-height: 1.4;
    }

    .disguiser-placeholder {
        margin-top: 12px;
        padding: 10px;
        border: 1px dashed #555;
        border-radius: 9px;
        color: #777;
        font-size: 14px;
    }

    @media (max-width: 650px) {
        header {
            flex-wrap: wrap;
        }

        .logo {
            width: 100%;
        }

        #search {
            order: 3;
            flex-basis: 100%;
        }

        main {
            padding: 20px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="logo">Game Hub</div>

    <input
        id="search"
        type="text"
        placeholder="Search games..."
        autocomplete="off"
    >

    <button class="settings-button" onclick="openSettings()">⚙ Settings</button>
</header>

<main>
    <div class="welcome">
        <h1>Welcome</h1>
        <p>Your games, all in one place.</p>
    </div>

    <div class="section-title">🎮 Games</div>

    <div class="grid" id="gameGrid">
        <!-- Add games here later.
        Example:

        <div class="game" data-name="Example Game"
             onclick="window.open('https://example.com', '_blank')">
            <img src="icon.png" alt="Example Game">
            <div class="game-name">Example Game</div>
        </div>
        -->

        <div class="empty" id="emptyMessage">
            No games added yet.
        </div>
    </div>
</main>

<!-- Settings -->
<div class="overlay" id="settingsOverlay" onclick="closeSettings(event)">
    <div class="settings-panel" onclick="event.stopPropagation()">
        <div class="settings-top">
            <h2>Settings</h2>
            <button class="close" onclick="closeSettings()">×</button>
        </div>

        <div class="setting">
            <div class="setting-title">Site Disguiser</div>
            <div class="setting-description">
                Disguise options will go here.
            </div>

            <div class="disguiser-placeholder">
                Disguiser system coming next...
            </div>
        </div>
    </div>
</div>

<script>
    const search = document.getElementById("search");
    const gameGrid = document.getElementById("gameGrid");
    const emptyMessage = document.getElementById("emptyMessage");

    search.addEventListener("input", () => {
        const query = search.value.toLowerCase().trim();
        const games = gameGrid.querySelectorAll(".game");
        let visible = 0;

        games.forEach(game => {
            const name = game.dataset.name?.toLowerCase() || "";
            const matches = name.includes(query);

            game.style.display = matches ? "" : "none";
            if (matches) visible++;
        });

        if (games.length > 0) {
            emptyMessage.style.display = visible === 0 ? "block" : "none";
        }
    });

    function openSettings() {
        document.getElementById("settingsOverlay").style.display = "block";
    }

    function closeSettings(event) {
        if (!event || event.target.id === "settingsOverlay") {
            document.getElementById("settingsOverlay").style.display = "none";
        }
    }
</script>

</body>
</html>
