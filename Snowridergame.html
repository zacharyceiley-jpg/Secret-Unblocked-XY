<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>0v0 - Secret Unblocked</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #0b0b0f;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        overflow-x: hidden;
    }

    .page {
        max-width: 1400px;
        margin: auto;
        padding: 20px;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .back-button,
    .control-button {
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        background: #1b1c23;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .back-button:hover,
    .control-button:hover {
        background: #252630;
    }

    .game-title {
        margin: 0;
        font-size: 28px;
    }

    .description {
        margin-bottom: 20px;
        padding: 18px;
        border-radius: 14px;
        background: #15161c;
        border: 1px solid #252630;
    }

    .description h2 {
        margin: 0 0 8px;
        font-size: 18px;
    }

    .description p {
        margin: 0;
        color: #b1b2bc;
        line-height: 1.6;
        white-space: pre-line;
    }

    .game-container {
        position: relative;
        width: 100%;
        height: min(75vh, 800px);
        min-height: 400px;
        overflow: hidden;
        border-radius: 16px;
        background: #000;
        border: 1px solid #252630;
    }

    #gameFrame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #000;
    }

    .controls {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
    }

    .redirect-container {
        display: none;
        text-align: center;
        padding: 60px 20px;
        border-radius: 16px;
        background: #15161c;
        border: 1px solid #252630;
    }

    .redirect-container h2 {
        margin-top: 0;
    }

    .redirect-container p {
        color: #a9aab4;
    }

    .play-button {
        display: inline-block;
        margin-top: 15px;
        padding: 13px 22px;
        border-radius: 10px;
        background: #fff;
        color: #000;
        text-decoration: none;
        font-weight: bold;
    }

    .play-button:hover {
        opacity: 0.85;
    }

    @media (max-width: 600px) {
        .page {
            padding: 12px;
        }

        .game-title {
            font-size: 22px;
        }

        .game-container {
            height: 65vh;
            min-height: 300px;
        }
    }
</style>
</head>

<body>
<div class="page">
    <div class="topbar">
        <button class="back-button" onclick="goBack()">← Back</button>
        <h1 class="game-title" id="gameTitle">0v0</h1>
    </div>

    <section class="description">
        <h2>About this game</h2>
        <p id="gameDescription">Loading description...</p>
    </section>

    <div class="game-container" id="embedContainer">
        <iframe
            id="gameFrame"
            allowfullscreen
            loading="eager"
            referrerpolicy="no-referrer"
        ></iframe>
    </div>

    <div class="redirect-container" id="redirectContainer">
        <h2>Ready to play?</h2>
        <p>This game opens in another page.</p>
        <a
            id="playButton"
            class="play-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Play Game
        </a>
    </div>

    <div class="controls">
        <button
            class="control-button"
            id="fullscreenButton"
            onclick="toggleFullscreen()"
        >
            ⛶ Fullscreen
        </button>
    </div>
</div>

<script>
const GAME_TITLE = "Snowrider 3D";

const GAME_DESCRIPTION = `
Experience the thrill of downhill skiing in Snow Rider 3D, where stunning 3D graphics meet exhilarating gameplay. Master the slopes, perform incredible tricks, and compete against players worldwide in this ultimate winter sports adventure.

Dive into the ultimate winter sports experience with Snow Rider 3D. Whether you're carving through fresh powder, pulling off spectacular aerial tricks, or racing against time, every run brings a new challenge. With realistic physics and responsive controls, you'll feel the rush of sliding down beautifully crafted mountain trails.

Created by TapNation and enjoyed by millions of players globally, Snow Rider 3D combines stunning visuals with engaging gameplay mechanics. The game features dynamic weather conditions, progressive difficulty levels, multiple character customization options, and real-time multiplayer competitions to keep you coming back for more thrilling runs.
`;

const GAME_URL = "https://snowrider-unblocked.github.io/game/";
const USE_EMBED = true;

const titleElement = document.getElementById("gameTitle");
const descriptionElement = document.getElementById("gameDescription");
const frame = document.getElementById("gameFrame");
const embedContainer = document.getElementById("embedContainer");
const redirectContainer = document.getElementById("redirectContainer");
const playButton = document.getElementById("playButton");
const fullscreenButton = document.getElementById("fullscreenButton");

document.title = GAME_TITLE + " - Secret Unblocked";
titleElement.textContent = GAME_TITLE;
descriptionElement.textContent = GAME_DESCRIPTION.trim();

if (USE_EMBED) {
    embedContainer.style.display = "block";
    redirectContainer.style.display = "none";
    frame.src = GAME_URL;
} else {
    embedContainer.style.display = "none";
    redirectContainer.style.display = "block";
    playButton.href = GAME_URL;
}

async function toggleFullscreen() {
    try {
        if (!document.fullscreenElement) {
            await embedContainer.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error("Fullscreen error:", error);
    }
}

function goBack() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }
}

document.addEventListener("fullscreenchange", () => {
    fullscreenButton.textContent = document.fullscreenElement
        ? "✕ Exit Fullscreen"
        : "⛶ Fullscreen";
});
</script>
</body>
</html>
